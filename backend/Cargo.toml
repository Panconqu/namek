[package]
name = "namek_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
mongodb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
rand = "0.8"
dotenvy = "0.15"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
